version: '3.8'

services:
  telegram-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      - NODE_ENV=production
      - RUN_STANDALONE_WORKER=true
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
